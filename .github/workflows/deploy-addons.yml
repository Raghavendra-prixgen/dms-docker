name: Deploy Odoo Addons

on:
  push:
    branches:
      - main
    paths:
      - "custom-addons/**"
      - "odoo.conf"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Debug
        run: |
          whoami
          pwd
          groups
          docker ps

      - name: Pull latest changes
        run: |
          cd /home/prixgen/Downloads/dms-docker
          git pull origin main

      - name: Restart Odoo
        run: |
          cd /home/prixgen/Downloads/dms-docker
          docker compose restart odoo

      - name: Check Status
        run: |
          docker ps



